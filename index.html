<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Graveyard Shift</title>
<style>
:root{--bg:#050705;--fg:#b8c8a6;--accent:#c9a227;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;width:min(100vw,160vh);aspect-ratio:8/5}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);text-align:center;cursor:pointer;padding:1rem;line-height:1.5}
#ov h1{margin:0 0 .5rem;color:#c3140c;letter-spacing:.2em;font-size:clamp(1.2rem,4vw,2.4rem)}
#ov p{margin:.2rem 0;font-size:clamp(.7rem,1.6vw,1rem)}

#ov{z-index:10}
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:120px;height:120px;background-size:100% 100%;image-rendering:pixelated;touch-action:none;z-index:6}

#pad{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:140px;height:140px;z-index:6;touch-action:none}
.tbtn{position:absolute;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background-size:100% 100%;image-rendering:pixelated;font:bold 9px "Courier New",monospace;letter-spacing:.04em;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tbtn.dn{filter:brightness(.68);transform:translateY(3px)}
#jrn{left:44px;top:0}#swap{left:0;top:44px}#use{right:0;top:44px}#fire{left:44px;bottom:0}
#look{position:fixed;right:0;top:0;width:55%;height:100%;touch-action:none;z-index:4}
#jbtn{margin:.6rem 0 .2rem;padding:.4rem 1.2rem;background:transparent;color:var(--accent);border:1px solid var(--accent);font:inherit;letter-spacing:.15em;cursor:pointer;font-size:clamp(.7rem,1.6vw,1rem)}
#jbtn:hover{background:rgba(201,162,39,.18)}
#signov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);z-index:11;cursor:pointer}
#signbd{width:min(78%,30em);box-sizing:border-box;padding:1.5em 1.7em 1.1em;background:repeating-linear-gradient(0deg,#5a3e22 0,#5a3e22 2.4em,#6a4a2a 2.4em,#6a4a2a calc(2.4em + 2px));border:.22em solid #1c1208;box-shadow:0 0 0 .18em #3a2a16,0 .7em 2.2em #000;font:bold clamp(12px,min(1.9vw,3vh),30px)/1.5 "Courier New",monospace;color:#f0e2b8;text-shadow:1px 1px 0 #000}
#signbd p{margin:0}#signp2{color:#ffd98a;margin-top:1em!important}
#signhint{text-align:center;color:#c9a227;font-size:.8em;margin-top:1.3em}
#jr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:12;padding:3%;box-sizing:border-box}
#jpage{width:min(92%,560px);max-height:100%;display:flex;flex-direction:column;background:#d8c9a0;color:#2a1c0e;border:3px solid #4a2f18;box-shadow:0 0 0 2px #1a1008,0 8px 30px #000;font-family:"Segoe Print","Bradley Hand","Marker Felt","Comic Sans MS",cursive}
#jpage h2{margin:0;padding:.5rem .9rem;font-size:clamp(.9rem,2.2vw,1.2rem);letter-spacing:.2em;background:#4a2f18;color:#d8c9a0;font-family:"Courier New",monospace}
#jlist{overflow-y:auto;padding:.6rem 1rem;font-size:clamp(.7rem,1.7vw,1rem);line-height:1.5}
.jent{margin-bottom:.8rem}
.jent h3{margin:.2rem 0;font-size:1em;border-bottom:1px solid rgba(42,28,14,.4)}
.jent p{margin:.4rem 0}
.jq{font-style:italic;padding-left:.8rem;border-left:3px solid rgba(42,28,14,.45)}
.jempty{opacity:.7;font-style:italic}
#jclose{margin:.4rem 1rem .8rem;align-self:flex-end;padding:.3rem 1rem;background:#4a2f18;color:#d8c9a0;border:0;font:inherit;font-family:"Courier New",monospace;letter-spacing:.12em;cursor:pointer}
#title{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#2a0707 0,#160404 55%,#070101 100%)}
#tmoon{position:absolute;right:11%;top:9%;width:min(11vw,18vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 62% 28%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 6.8%,rgba(222,225,230,.6) 9.9%,transparent 11.0%),radial-gradient(circle at 30% 40%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 9.3%,rgba(222,225,230,.6) 13.5%,transparent 15.0%),radial-gradient(circle at 55% 62%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 5.6%,rgba(222,225,230,.6) 8.1%,transparent 9.0%),radial-gradient(circle at 72% 55%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 4.3%,rgba(222,225,230,.6) 6.3%,transparent 7.0%),radial-gradient(circle at 38% 74%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 5.0%,rgba(222,225,230,.6) 7.2%,transparent 8.0%),radial-gradient(circle at 22% 22%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 3.7%,rgba(222,225,230,.6) 5.4%,transparent 6.0%),radial-gradient(circle at 80% 36%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 3.1%,rgba(222,225,230,.6) 4.5%,transparent 5.0%),radial-gradient(circle at 48% 30%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 3.1%,rgba(222,225,230,.6) 4.5%,transparent 5.0%),radial-gradient(circle at 66% 78%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 3.7%,rgba(222,225,230,.6) 5.4%,transparent 6.0%),radial-gradient(circle at 15% 58%,rgba(128,132,138,.5) 0,rgba(140,144,150,.45) 3.1%,rgba(222,225,230,.6) 4.5%,transparent 5.0%),radial-gradient(ellipse at 45% 50%,rgba(120,124,130,.55) 0,transparent 40%),radial-gradient(circle at 36% 32%,#eceef0,#b4b7bb 45%,#80848a 75%,#4c4f55);box-shadow:0 0 5vw 1.4vw rgba(200,208,220,.2),inset -1.2vw -1vw 2vw rgba(20,22,28,.5);opacity:.85}
#tclouds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tc{position:absolute;left:-45vw;width:34vw;height:9vw;top:calc(var(--mc,14vh) + var(--o,0vw) - 4.5vw);opacity:var(--op,.5);filter:blur(.55vw);animation:tcd var(--d,60s) linear infinite;animation-delay:var(--dl,0s);background:radial-gradient(ellipse 30% 45% at 22% 58%,#6d7075,transparent 70%),radial-gradient(ellipse 34% 55% at 45% 42%,#7b7e83,transparent 70%),radial-gradient(ellipse 30% 48% at 68% 55%,#6a6d72,transparent 70%),radial-gradient(ellipse 24% 38% at 85% 62%,#5f6267,transparent 70%),radial-gradient(ellipse 50% 28% at 50% 72%,#55585d,transparent 75%)}
@keyframes tcd{to{transform:translateX(190vw)}}
#tfog,#tfog:after{position:absolute;inset:-20% -50%;background:radial-gradient(ellipse at 30% 60%,rgba(120,140,120,.16),transparent 55%),radial-gradient(ellipse at 70% 70%,rgba(120,140,120,.12),transparent 50%);animation:tdrift 26s linear infinite alternate;content:""}
#tfog:after{inset:0;animation-duration:38s;animation-direction:alternate-reverse}
@keyframes tdrift{to{transform:translateX(18%)}}
#tgy{position:absolute;left:0;right:0;bottom:0;height:24%;background:#000;clip-path:polygon(0 100%,0 62%,5% 62%,5% 46%,8% 38%,11% 46%,11% 62%,22% 62%,22% 54%,24% 54%,24% 22%,26% 22%,26% 36%,28% 36%,28% 54%,30% 54%,30% 62%,45% 62%,45% 44%,48% 35%,51% 44%,51% 62%,64% 62%,64% 52%,70% 52%,70% 62%,82% 62%,82% 42%,85% 33%,88% 42%,88% 62%,100% 62%,100% 100%)}
#tmain{position:relative;top:7vh;display:flex;flex-direction:column;align-items:center;gap:min(2.2vw,3.5vh)}
#tsub{color:#8a2a20;letter-spacing:.5em;font-size:clamp(.55rem,1.4vw,.9rem)}
#tt{margin:0;font-family:'Metal Mania','Creepster',Impact,'Arial Black',fantasy;font-weight:400;line-height:.88;font-size:min(12vw,19vh);letter-spacing:.04em;text-transform:uppercase;animation:tflick 5s infinite}
#tt span{display:block;background:linear-gradient(#ff5a3c 0,#c3140c 45%,#4a0504 85%,#240202);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .03em 0 #000) drop-shadow(0 0 .2em rgba(255,30,10,.6))}
#tt span:first-child{font-size:.78em}#tt span+span{font-size:1em;letter-spacing:.12em}
@keyframes tflick{0%,90%,94%,100%{opacity:1}92%{opacity:.55}96%{opacity:.8}}
#tmenu,#tlv{transform:translateY(calc(-1*min(8vw,13vh)));display:flex;flex-direction:column;gap:min(2vw,3.2vh)}
.tree{overflow:visible;position:absolute;bottom:5%;width:auto;fill:#000;pointer-events:none;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite;filter:drop-shadow(0 0 .5vw rgba(170,30,20,.35))}
.tree.m{scale:-1 1}.tree.t1{left:-3%;height:88%}.tree.t2{right:-3%;height:88%;animation-delay:-3s}.tree.t3{left:15%;height:46%;animation-delay:-1.5s}.tree.t4{right:17%;height:46%;animation-delay:-5s}
@keyframes sway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.8deg)}}
#tbats{position:absolute;inset:0;pointer-events:none}
.bat{position:absolute;left:-10%;animation:flyr linear infinite}.bat.r{animation-name:flyl}
.bat svg{display:block;width:100%;height:auto;overflow:visible;fill:#120606;stroke:#4a1410;stroke-width:.35;animation:bob var(--bb,2.4s) ease-in-out infinite;filter:drop-shadow(0 0 .3vw rgba(200,40,25,.45))}
.bat.r svg{scale:-1 1}.bat .e{fill:#ff4a38;stroke:none}
.bat .wl{transform-origin:11px 6px;animation:fl var(--f,.3s) ease-in-out infinite}.bat .wr{transform-origin:13px 6px;animation:fr var(--f,.3s) ease-in-out infinite}
@keyframes flyr{from{left:-10%}to{left:105%}}@keyframes flyl{from{left:105%}to{left:-10%}}
@keyframes bob{0%,100%{translate:0 -1.5vh}50%{translate:0 1.5vh}}
@keyframes fl{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(24deg)}}
@keyframes fr{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-24deg)}}
#tlv{display:none}
#title button{--b:#b8a05a;--rim:#3a2f10;--lt:#ddd0a0;--sh:#7a6a38;min-width:min(24vw,38vh);padding:.55em 1em .5em;background:var(--b);color:#ece4d0;border:0;border-radius:0;font:bold clamp(.65rem,1.4vw,.95rem)/1.2 "Courier New",monospace;letter-spacing:.2em;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;cursor:pointer;box-shadow:inset .2em .2em 0 var(--lt),inset -.2em -.28em 0 var(--sh),0 0 0 .2em var(--rim),0 .4em 0 .2em #000;image-rendering:pixelated;touch-action:manipulation}
#title [data-a=start]{--b:#a8584c;--rim:#3a1410;--lt:#d09c92;--sh:#6e302a}
#title [data-a=l0]{--b:#6a84a8;--rim:#1a2538;--lt:#a8bcd8;--sh:#3e526e}
#title [data-a=l1]{--b:#8268a0;--rim:#2a2038;--lt:#b8a8d0;--sh:#4c3e68}
#title [data-a=back]{--b:#b8ad8c;--rim:#3d3420;--lt:#dcd3b8;--sh:#7a7050}
#title button:hover{filter:brightness(1.15)}
#title button:active{filter:brightness(.78);transform:translateY(.3em);box-shadow:inset .2em .2em 0 var(--lt),inset -.2em -.28em 0 var(--sh),0 0 0 .2em var(--rim),0 .1em 0 .2em #000}
#title button:focus{outline:0}#title button:focus-visible{outline:.15em dashed #fff;outline-offset:.55em}
#title small{display:block;margin-top:.3em;font-size:.6em;letter-spacing:.12em;color:#9a8c72}
#pbtn{position:fixed;left:50%;margin-left:-34px;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:7;width:68px;height:26px;padding:0;background:linear-gradient(#7d848d 0,#7d848d 14%,#5a6069 14%,#4a4f57 100%);color:#15171a;border:3px solid #0b0d0e;border-radius:2px;box-shadow:inset 2px 2px 0 #aab0b8,inset -2px -3px 0 #2c3036,0 3px 0 #000;font:bold 9px "Courier New",monospace;letter-spacing:.12em;text-shadow:0 1px 0 rgba(255,255,255,.25);cursor:pointer;image-rendering:pixelated;touch-action:none}
#pbtn:active{transform:translateY(3px);box-shadow:inset 2px 2px 0 #aab0b8,inset -2px -3px 0 #2c3036,0 0 0 #000;filter:brightness(.8)}
#rb{display:flex;flex-direction:column;gap:.5rem;margin:.8rem 0}

#title button,#rb button,#jbtn{font-family:'UnifrakturCook','Old English Text MT','Blackadder ITC',Georgia,serif;font-weight:700}

#title button:hover{filter:brightness(1.3);box-shadow:inset .2em .2em 0 var(--lt),inset -.2em -.28em 0 var(--sh),0 0 0 .2em var(--rim),0 .4em 0 .2em #000,0 0 1.6em rgba(230,30,15,.55)}

#title button:hover{box-shadow:inset .14em .14em 0 var(--lt),inset -.14em -.2em 0 var(--sh),0 0 0 .14em var(--rim),0 .3em 0 .14em #000,0 0 1.6em rgba(230,30,15,.55)}

#tmenu,#tlv{gap:min(3.4vw,5.4vh)}

#tt{translate:0 -7vh}
#tlv{flex-direction:row;flex-wrap:wrap;justify-content:center;width:min(54vw,84vh);row-gap:min(3.4vw,5.4vh);column-gap:min(2.4vw,3.6vh)}

#jbtn{font-size:.7rem}
}
